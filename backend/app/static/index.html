<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>PrepLoop</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <!-- Shown until we know whether there's a session. -->
  <main id="loading" class="center"><p class="muted">Loading…</p></main>

  <main id="login" class="center" hidden>
    <h1>PrepLoop</h1>
    <p class="muted">Practice your interview answers.</p>
    <div id="google-button"></div>
    <p id="login-error" class="error" hidden></p>
  </main>

  <div id="app" hidden>
    <header class="topbar">
      <strong class="brand">PrepLoop</strong>
      <nav class="tabs">
        <button class="tab active" data-view="library">Library</button>
        <button class="tab" data-view="practice">Practice</button>
        <button class="tab" data-view="io">Import / Export</button>
      </nav>
      <span class="spacer"></span>
      <span id="user-email" class="muted small hide-narrow"></span>
      <button id="logout" class="link">Sign out</button>
    </header>

    <main class="content">
      <!-- Library -->
      <section id="view-library">
        <div class="toolbar">
          <input id="f-q" type="search" placeholder="Search questions, answers, notes…" maxlength="200">
          <select id="f-type" aria-label="Type">
            <option value="">All types</option>
            <option value="technical">Technical</option>
            <option value="behavioral">Behavioral</option>
          </select>
          <select id="f-tag" aria-label="Tag">
            <option value="">All tags</option>
          </select>
          <select id="f-conf" aria-label="Confidence">
            <option value="">Any confidence</option>
            <option value="1-2">Low (1–2)</option>
            <option value="3-3">Medium (3)</option>
            <option value="4-5">High (4–5)</option>
          </select>
          <select id="f-sort" aria-label="Sort">
            <option value="createdAt:desc">Newest first</option>
            <option value="createdAt:asc">Oldest first</option>
            <option value="confidence:asc">Lowest confidence</option>
            <option value="confidence:desc">Highest confidence</option>
            <option value="lastPracticed:asc">Least recently practiced</option>
            <option value="lastPracticed:desc">Most recently practiced</option>
          </select>
          <button id="add-btn" class="primary">+ Add question</button>
        </div>
        <p id="lib-status" class="muted small"></p>
        <div id="q-list" class="cards"></div>
      </section>

      <!-- Practice -->
      <section id="view-practice" hidden>
        <div class="toolbar">
          <select id="p-type" aria-label="Type">
            <option value="">All types</option>
            <option value="technical">Technical</option>
            <option value="behavioral">Behavioral</option>
          </select>
          <select id="p-tag" aria-label="Tag">
            <option value="">All tags</option>
          </select>
          <button id="p-start" class="primary">Start practice</button>
          <span class="spacer"></span>
          <span id="p-count" class="muted small"></span>
        </div>

        <p id="p-status" class="muted"></p>

        <article id="p-card" class="card practice-card" hidden>
          <div class="card-head">
            <span id="p-badge" class="badge"></span>
            <span id="p-dots"></span>
            <span class="spacer"></span>
            <button id="p-skip" class="link">Skip</button>
          </div>
          <h2 id="p-question" class="q-text"></h2>
          <div id="p-tags" class="tags"></div>

          <details id="p-try">
            <summary>Type a fresh answer and get AI feedback (optional)</summary>
            <textarea id="p-typed" rows="5" maxlength="10000" placeholder="Answer as if you were in the interview…"></textarea>
            <div class="fb-actions">
              <button id="p-fb-typed">Get feedback on this</button>
              <button id="p-save-typed" class="link" hidden>Save as my answer</button>
            </div>
          </details>

          <button id="p-reveal" class="primary">Reveal answer <kbd>Space</kbd></button>

          <div id="p-answer" hidden>
            <div id="p-answer-body"></div>
            <button id="p-fb-saved" class="link">Get AI feedback on my saved answer</button>
            <div class="rate">
              <p class="small muted">How confident do you feel now?</p>
              <div class="rate-buttons">
                <button data-rate="1">1</button>
                <button data-rate="2">2</button>
                <button data-rate="3">3</button>
                <button data-rate="4">4</button>
                <button data-rate="5">5</button>
              </div>
              <p class="small muted kbd-hint">Keys 1–5 work too.</p>
            </div>
          </div>

          <div id="p-feedback" class="feedback" hidden></div>
        </article>
      </section>

      <!-- Import / Export (step 7) -->
      <section id="view-io" hidden>
        <p class="muted">Import and export are coming soon.</p>
      </section>
    </main>
  </div>

  <!-- AI feedback for a library question -->
  <dialog id="fb-dialog">
    <h2>AI feedback</h2>
    <p id="fb-dialog-question" class="muted"></p>
    <div id="fb-dialog-body" class="feedback"></div>
    <div class="actions">
      <button id="fb-dialog-close">Close</button>
    </div>
  </dialog>

  <!-- Add / edit question -->
  <dialog id="q-dialog">
    <form id="q-form">
      <h2 id="q-form-title">Add question</h2>

      <div class="row">
        <label>Type
          <select name="type">
            <option value="technical">Technical</option>
            <option value="behavioral">Behavioral</option>
          </select>
        </label>
        <label>Confidence
          <select name="confidence">
            <option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option>
          </select>
        </label>
      </div>

      <label>Question
        <textarea name="question" rows="2" maxlength="2000" required></textarea>
      </label>

      <label>My answer
        <textarea name="answer" rows="6" maxlength="10000"></textarea>
      </label>

      <fieldset id="star-fields">
        <legend>STAR (optional)</legend>
        <label>Situation <textarea name="situation" rows="2" maxlength="4000"></textarea></label>
        <label>Task <textarea name="task" rows="2" maxlength="4000"></textarea></label>
        <label>Action <textarea name="action" rows="2" maxlength="4000"></textarea></label>
        <label>Result <textarea name="result" rows="2" maxlength="4000"></textarea></label>
      </fieldset>

      <label>Tags <span class="muted small">(comma separated)</span>
        <input name="tags" placeholder="RAG, AWS, leadership" maxlength="900">
      </label>

      <label>Notes
        <textarea name="notes" rows="2" maxlength="4000"></textarea>
      </label>

      <p id="q-form-error" class="error" hidden></p>

      <div class="actions">
        <button type="button" id="q-cancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>
</body>
</html>
