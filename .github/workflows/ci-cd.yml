# Tests run on every push and pull request.
# Pushes to main that pass the tests are deployed to AWS with SAM.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" button, e.g. to redeploy after changing a secret

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest -q

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Check the SAM template
        run: sam validate --lint

  deploy:
    needs: test
    # Only main, never pull requests (forks get no AWS access anyway).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Never run two deploys at once; queue the newer one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # lets GitHub prove to AWS who it is (OIDC), no stored keys
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build
        run: sam build

      # samconfig.toml isn't in git, so every setting is passed here.
      # Personal values are secrets so they're masked in the public logs.
      - name: Deploy
        run: >
          sam deploy
          --stack-name preploop
          --region us-east-1
          --resolve-s3
          --s3-prefix preploop
          --capabilities CAPABILITY_IAM
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --parameter-overrides
          GoogleClientId=${{ secrets.GOOGLE_CLIENT_ID }}
          AllowedEmail=${{ secrets.ALLOWED_EMAIL }}
          DomainName=${{ vars.DOMAIN_NAME }}
          HostedZoneId=${{ secrets.HOSTED_ZONE_ID }}
          FeedbackModelId=${{ vars.FEEDBACK_MODEL_ID || 'us.amazon.nova-lite-v1:0' }}
          ReservedConcurrency=${{ vars.RESERVED_CONCURRENCY || '0' }}

      - name: Smoke test
        run: |
          url="https://${{ vars.DOMAIN_NAME }}/api/health"
          for i in 1 2 3 4 5; do
            if curl -fsS "$url"; then echo; exit 0; fi
            sleep 10
          done
          echo "Health check failed: $url"
          exit 1
